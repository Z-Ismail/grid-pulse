# Local profile. Credentials come from environment variables (see ../.env).
# Run dbt with:  dbt <cmd> --profiles-dir .
grid_pulse:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: grid_pulse_dbt
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'grid') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'grid') }}"
      secure: false
